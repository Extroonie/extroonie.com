baseURL = 'https://extroonie.com/'
locale = 'en-us'
timeZone = 'Asia/Dhaka'
title = 'Ishmaam Khan'
publishDir = 'dist'
enableRobotsTXT = true
disableHugoGeneratorInject = true
summaryLength = 40
[taxonomies]
tag = 'tags'
[params]
author = 'Ishmaam Khan'
description = "Hi! I’m Ishmaam. I write software and spend a lot of time thinking about science, philosophy, and whatever else catches my interest."
images = ['images/Pale_Blue_Dot.png']
[outputs]
home = ['HTML', 'RSS']
section = ['HTML', 'RSS']
taxonomy = ['HTML']
term = ['HTML']
[outputFormats.RSS]
baseName = 'rss'
[markup.goldmark.extensions]
typographer = true
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)']]
[markup.goldmark.parser.attribute]
block = true
[markup.goldmark.renderer]
unsafe = false
[markup.highlight]
codeFences = false
[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

[[module.mounts]]
source = 'static'
target = 'static'
[[module.mounts]]
source = 'node_modules/katex/dist'
target = 'static/vendor/katex'
files = ['katex.min.css', 'fonts/**']

[[module.mounts]]
source = 'node_modules/@fontsource-variable/newsreader/files'
target = 'static/fonts'
files = ['newsreader-latin-wght-normal.woff2', 'newsreader-latin-wght-italic.woff2']
