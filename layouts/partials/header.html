<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header shell">
	{{ if .IsHome }}
		<h1 class="site-name"><a href="/">{{ site.Title }}</a></h1>
	{{ else }}
		<a class="site-name" href="/">{{ site.Title }}</a>
	{{ end }}
	<button class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Dark mode" hidden>
		<span class="toggle-thumb">{{ partial "icon.html" . }}</span>
	</button>
</header>
