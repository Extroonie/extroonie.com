services:
    site:
        image: ${SITE_IMAGE:-extroonie:local}
        build:
            context: .
            target: production
            args:
                SITE_BASE_URL: ${SITE_BASE_URL:-}
        ports:
            - '127.0.0.1:${SITE_PORT:-8080}:8080'
        restart: unless-stopped
        healthcheck:
            test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/']
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 5s
    dev:
        profiles: [dev]
        build:
            context: .
            target: development
        ports:
            - '127.0.0.1:${DEV_PORT:-1313}:${DEV_PORT:-1313}'
        volumes:
            - .:/site
            - dev_dependencies:/site/node_modules
        command:
            [
                sh,
                -c,
                'bun install --frozen-lockfile --ignore-scripts && exec bun run dev --host 0.0.0.0 --port ${DEV_PORT:-1313}',
            ]
volumes:
    dev_dependencies:
